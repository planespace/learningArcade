<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Analytics – Learning Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0f0f23;
        --teal: #00d2ff;
        --orange: #ff5e3a;
        --white: #fff;
        --gray-light: #ccc;
        --gray: #8892a4;
        --green: #2ecc71;
        --red: #e74c3c;
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--navy);
        color: var(--white);
        padding: 2rem;
        min-height: 100vh;
      }
      .dashboard {
        max-width: 1300px;
        margin: 0 auto;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
        color: var(--teal);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .btn {
        background: var(--teal);
        color: #000;
        padding: 0.5rem 1.2rem;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.85rem;
        margin-left: 0.5rem;
      }
      .btn:hover {
        background: #00a6cc;
      }

      .summary-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius);
        padding: 1.5rem;
        text-align: center;
      }
      .card .number {
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--teal);
      }
      .card .label {
        font-size: 0.85rem;
        color: var(--gray);
        margin-top: 0.3rem;
      }

      .section {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .section h2 {
        font-size: 1.3rem;
        color: var(--teal);
        margin-bottom: 1rem;
      }

      .bar-row {
        display: flex;
        align-items: center;
        margin: 0.4rem 0;
      }
      .bar-label {
        width: 130px;
        font-weight: 500;
        font-size: 0.9rem;
      }
      .bar-track {
        flex: 1;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        height: 18px;
        overflow: hidden;
        margin: 0 1rem;
      }
      .bar-fill {
        height: 100%;
        border-radius: 8px;
        background: var(--teal);
      }
      .bar-fill.orange {
        background: var(--orange);
      }
      .bar-fill.green {
        background: var(--green);
      }
      .bar-count {
        width: 80px;
        text-align: right;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .session-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 0.8rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .session-card:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .session-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .session-id {
        font-weight: 600;
        color: var(--teal);
      }
      .session-duration {
        font-size: 0.85rem;
        color: var(--gray);
      }
      .session-path {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }
      .step-chip {
        background: rgba(0, 210, 255, 0.15);
        color: var(--teal);
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.8rem;
      }
      .step-chip.skip {
        background: rgba(255, 107, 53, 0.2);
        color: var(--orange);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th,
      td {
        padding: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        text-align: left;
      }
      th {
        color: var(--teal);
      }

      .no-data {
        text-align: center;
        color: var(--gray);
        padding: 2rem;
      }

      @media (max-width: 600px) {
        body {
          padding: 1rem;
        }
        .bar-label {
          width: 90px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <h1>
        📋 Session Analytics
        <div>
          <button class="btn" onclick="exportCSV()">Export CSV</button>
          <button class="btn" onclick="location.reload()">Refresh</button>
        </div>
      </h1>

      <div class="summary-cards" id="summary"></div>

      <div class="section" id="funnel-section">
        <h2>📈 User Funnel (Step Drop‑off)</h2>
        <div id="funnel-bars"></div>
      </div>

      <div class="section" id="dropoff-section">
        <h2>⚠️ Most Common Drop‑off Points</h2>
        <div id="dropoff-list"></div>
      </div>

      <div class="section" id="sessions-section">
        <h2>🧑‍💻 Individual Sessions</h2>
        <div id="sessions-list"></div>
      </div>

      <div class="section" id="raw-section" style="display: none">
        <h2>📄 Raw Events</h2>
        <div id="raw-table" style="overflow-x: auto"></div>
      </div>
    </div>

    <script>
      let allEvents = [];

      async function loadData() {
        try {
          const res = await fetch("/api/events");
          allEvents = await res.json();
          render(allEvents);
        } catch (err) {
          document.getElementById("sessions-list").innerHTML =
            '<div class="no-data">Failed to load events.</div>';
        }
      }

      function render(events) {
        if (!events || events.length === 0) {
          document.getElementById("summary").innerHTML =
            '<div class="no-data">No events yet.</div>';
          return;
        }

        // Group events by sessionId
        const sessions = {};
        events.forEach((e) => {
          if (!sessions[e.sessionId]) sessions[e.sessionId] = [];
          sessions[e.sessionId].push(e);
        });

        // Sort sessions by first event time
        const sessionList = Object.entries(sessions)
          .map(([id, evts]) => {
            evts.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            const first = evts[0];
            const last = evts[evts.length - 1];
            const totalDuration = evts.reduce(
              (sum, e) => sum + (e.duration || 0),
              0
            );
            const steps = [...new Set(evts.map((e) => `${e.step}.${e.phase}`))];
            const hasSkip = evts.some((e) => e.action === "skip");
            return { id, first, last, totalDuration, steps, hasSkip, evts };
          })
          .sort(
            (a, b) => new Date(a.first.timestamp) - new Date(b.first.timestamp)
          );

        // Summary cards
        const totalSessions = sessionList.length;
        const avgDuration = Math.round(
          sessionList.reduce((sum, s) => sum + s.totalDuration, 0) /
            totalSessions
        );
        const skipCount = sessionList.filter((s) => s.hasSkip).length;
        const completedSurveys = sessionList.filter((s) =>
          s.steps.some((st) => st.startsWith("5."))
        ).length;

        document.getElementById("summary").innerHTML = `
                <div class="card"><div class="number">${totalSessions}</div><div class="label">Total Sessions</div></div>
                <div class="card"><div class="number">${Math.floor(
                  avgDuration / 60
                )}m ${
          avgDuration % 60
        }s</div><div class="label">Avg Session Duration</div></div>
                <div class="card"><div class="number">${skipCount}</div><div class="label">Skipped to Survey</div></div>
                <div class="card"><div class="number">${completedSurveys}</div><div class="label">Reached Survey (Step 5)</div></div>
            `;

        // Funnel: count unique sessions that reached each step
        const stepNames = ["0", "1", "2", "3", "4", "5", "6"];
        const funnel = stepNames.map((step) => {
          return sessionList.filter((s) =>
            s.steps.some((st) => st.startsWith(step + "."))
          ).length;
        });
        const maxFunnel = Math.max(...funnel);
        document.getElementById("funnel-bars").innerHTML = stepNames
          .map((step, i) => {
            const count = funnel[i];
            const width = ((count / maxFunnel) * 100).toFixed(0);
            const labelMap = {
              0: "Welcome",
              1: "Inertia",
              2: "F=ma",
              3: "Action/Reaction",
              4: "Synthesis",
              5: "Survey",
              6: "Thank You",
            };
            return `<div class="bar-row">
                    <div class="bar-label">Step ${step} – ${labelMap[step]}</div>
                    <div class="bar-track"><div class="bar-fill orange" style="width:${width}%"></div></div>
                    <div class="bar-count">${count}</div>
                </div>`;
          })
          .join("");

        // Drop-off points: find sessions that stopped at a step and never progressed
        const dropOffs = {};
        sessionList.forEach((s) => {
          const lastStep = s.steps[s.steps.length - 1];
          if (lastStep && lastStep !== "6.0" && lastStep !== "5.0") {
            // didn't finish
            const key = lastStep;
            dropOffs[key] = (dropOffs[key] || 0) + 1;
          }
        });
        const sortedDropOffs = Object.entries(dropOffs).sort(
          (a, b) => b[1] - a[1]
        );
        document.getElementById("dropoff-list").innerHTML =
          sortedDropOffs.length > 0
            ? sortedDropOffs
                .map(
                  ([step, count]) => `
                    <div class="bar-row">
                        <div class="bar-label">Step.Phase ${step}</div>
                        <div class="bar-track"><div class="bar-fill green" style="width:${(
                          (count / totalSessions) *
                          100
                        ).toFixed(0)}%"></div></div>
                        <div class="bar-count">${count}</div>
                    </div>
                `
                )
                .join("")
            : '<div class="no-data">No drop‑offs yet (all sessions completed or skipped).</div>';

        // Individual sessions
        document.getElementById("sessions-list").innerHTML = sessionList
          .map(
            (s) => `
                <div class="session-card" onclick="toggleRaw('${s.id}')">
                    <div class="session-header">
                        <span class="session-id">Session ${s.id.slice(
                          -6
                        )}</span>
                        <span class="session-duration">${Math.floor(
                          s.totalDuration / 60
                        )}m ${s.totalDuration % 60}s</span>
                    </div>
                    <div class="session-path">
                        ${s.steps
                          .map((st) => {
                            const cls = s.evts.some(
                              (e) =>
                                e.action === "skip" &&
                                `${e.step}.${e.phase}` === st
                            )
                              ? "skip"
                              : "";
                            return `<span class="step-chip ${cls}">${st}</span>`;
                          })
                          .join(" → ")}
                    </div>
                    <div id="raw-${
                      s.id
                    }" style="display:none; margin-top:0.5rem; overflow-x:auto;"></div>
                </div>
            `
          )
          .join("");

        // Store for raw toggle
        window._sessionMap = sessions;
      }

      function toggleRaw(sessionId) {
        const div = document.getElementById("raw-" + sessionId);
        if (div.style.display === "none" || !div.style.display) {
          const evts = window._sessionMap[sessionId];
          div.innerHTML = `<table>
                    <thead><tr><th>Time</th><th>Step.Phase</th><th>Action</th><th>Duration</th></tr></thead>
                    <tbody>${evts
                      .map(
                        (e) => `
                        <tr>
                            <td>${new Date(
                              e.timestamp
                            ).toLocaleTimeString()}</td>
                            <td>${e.step}.${e.phase}</td>
                            <td>${e.action}</td>
                            <td>${e.duration || ""}</td>
                        </tr>
                    `
                      )
                      .join("")}</tbody>
                </table>`;
          div.style.display = "block";
        } else {
          div.style.display = "none";
        }
      }

      function exportCSV() {
        if (allEvents.length === 0) return alert("No data to export.");
        const rows = allEvents.map((e) => [
          e.sessionId,
          e.step,
          e.phase,
          e.action,
          e.duration,
          new Date(e.timestamp).toISOString(),
        ]);
        const csv = [
          "sessionId,step,phase,action,duration,timestamp",
          ...rows.map((r) => r.join(",")),
        ].join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "session-events.csv";
        a.click();
        URL.revokeObjectURL(url);
      }

      loadData();
    </script>
  </body>
</html>
