<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Session Events – Learning Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0f0f23;
        color: #fff;
        font-family: "Inter", sans-serif;
        padding: 2rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
      }
      th {
        color: #00d2ff;
      }
      .refresh-btn {
        background: #00d2ff;
        color: #000;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>📋 Session Events</h1>
    <button class="refresh-btn" onclick="location.reload()">Refresh</button>
    <table id="eventsTable">
      <thead>
        <tr>
          <th>Session</th>
          <th>Step.Phase</th>
          <th>Action</th>
          <th>Duration (s)</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script>
      fetch("/api/events")
        .then((res) => res.json())
        .then((events) => {
          const tbody = document.querySelector("#eventsTable tbody");
          tbody.innerHTML = events
            .map(
              (e) => `
                  <tr>
                      <td>${e.sessionId?.slice(-6) || ""}</td>
                      <td>${e.step}.${
                e.phase !== undefined ? e.phase : "—"
              }</td>
                      <td>${e.action}</td>
                      <td>${e.duration || ""}</td>
                      <td>${new Date(e.timestamp).toLocaleString()}</td>
                  </tr>
              `
            )
            .join("");
          if (events.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">No events yet.</td></tr>';
          }
        })
        .catch((err) => {
          document.querySelector("#eventsTable tbody").innerHTML =
            '<tr><td colspan="5">Failed to load events.</td></tr>';
          console.error(err);
        });
    </script>
  </body>
</html>
