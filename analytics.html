<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics Dashboard – Learning Arcade</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #0f0f23;
        color: #fff;
        padding: 2rem;
      }
      .dashboard {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 1rem;
      }
      .card h3 {
        color: #00d2ff;
        margin-bottom: 0.5rem;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        margin: 0.3rem 0;
      }
      .stat span:last-child {
        font-weight: 600;
        color: #ff5e3a;
      }
      .no-data {
        text-align: center;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <h1>📊 Learning Arcade – Analytics</h1>
      <div id="analytics"></div>
    </div>
    <script>
      fetch("/api/analytics")
        .then((res) => res.json())
        .then((data) => {
          const container = document.getElementById("analytics");
          if (!data || data.length === 0) {
            container.innerHTML =
              '<div class="no-data">No analytics yet. Complete the demo first.</div>';
            return;
          }
          const latest = data[0]; // show the most recent entry
          container.innerHTML = `
              <div class="card"><h3>User Feedback</h3>
                <div class="stat"><span>Rating</span><span>${
                  "★".repeat(latest.rating) + "☆".repeat(5 - latest.rating)
                } (${latest.rating}/5)</span></div>
                <div class="stat"><span>Textbook comparison</span><span>${
                  latest.textbookBetter || "N/A"
                }</span></div>
              </div>
              <div class="card"><h3>Purchase Intent</h3>
                <div class="stat"><span>Plan chosen</span><span>${
                  latest.chosenPlan || "None"
                }</span></div>
                <div class="stat"><span>Subjects</span><span>${
                  (latest.chosenSubjects || []).join(", ") || "N/A"
                }</span></div>
                <div class="stat"><span>Email entered</span><span>${
                  latest.enteredEmail ? "Yes" : "No"
                }</span></div>
                <div class="stat"><span>Usage frequency</span><span>${
                  latest.usageFrequency || "N/A"
                }</span></div>
              </div>
              <div class="card"><h3>Session Stats</h3>
                <div class="stat"><span>Total XP</span><span>${
                  latest.totalXP || 0
                }</span></div>
                <div class="stat"><span>Modules completed</span><span>${
                  latest.modulesCompleted || 0
                }/3</span></div>
                <div class="stat"><span>Time spent</span><span>${
                  latest.timeSpent
                    ? Math.floor(latest.timeSpent / 60) +
                      "m " +
                      (latest.timeSpent % 60) +
                      "s"
                    : "N/A"
                }</span></div>
              </div>
          `;
        })
        .catch((err) => {
          document.getElementById("analytics").innerHTML =
            '<div class="no-data">Failed to load analytics.</div>';
        });
    </script>
  </body>
</html>
